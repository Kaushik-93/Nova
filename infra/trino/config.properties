# Single-node Trino, based on the image default.
#
# catalog.management=dynamic lets a newly connected source be added with CREATE
# CATALOG and no restart. Trino logs that statement in full, so Nova never puts a
# password in it: the catalog points at a credentials file instead. See
# docs/DECISIONS.md (D-003).
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
catalog.management=dynamic
catalog.store=file
cache-manager.config-files=etc/cache-manager-memory.properties
query.max-execution-time=5m
