# superset-init owns the build; the other Superset services reuse its image.
# Building the same tag from several services at once fails.
x-superset-image: &superset-image
  image: nova-superset:6.1.0
  pull_policy: never

x-superset-env: &superset-env
  SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?run `make env` first}
  SUPERSET_DATABASE_URI: postgresql+psycopg2://${METADATA_DB_USER}:${METADATA_DB_PASSWORD}@metadata-db:5432/superset
  SUPERSET_GUEST_TOKEN_SECRET: ${SUPERSET_GUEST_TOKEN_SECRET:?run `make env` first}
  REDIS_URL: ${REDIS_URL}
  NOVA_UI_ORIGIN: ${NOVA_UI_ORIGIN}
  SCARF_ANALYTICS: "false"

x-agent-env: &agent-env
  SUPERSET_URL: ${SUPERSET_URL}
  SUPERSET_PUBLIC_URL: ${SUPERSET_PUBLIC_URL}
  SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
  SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
  NOVA_UI_ORIGIN: ${NOVA_UI_ORIGIN}
  TRINO_URL: ${TRINO_URL}
  CUBE_URL: http://cube:4000
  CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:?run `make env` first}
  DATABASE_URL: ${DATABASE_URL}
  MODEL_PROVIDER: ${MODEL_PROVIDER:-anthropic}
  MODEL_NAME: ${MODEL_NAME:-claude-opus-5-5}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  NOVA_SKILLS_DIR: /app/skills
  NOVA_PUBLIC_API_URL: ${NOVA_PUBLIC_API_URL}
  NOVA_JWT_SECRET: ${NOVA_JWT_SECRET}
  NOVA_ADMIN_EMAIL: ${NOVA_ADMIN_EMAIL}
  NOVA_ADMIN_PASSWORD: ${NOVA_ADMIN_PASSWORD}
  FERNET_KEY: ${FERNET_KEY}
  DEMO_RO_PASSWORD: ${DEMO_RO_PASSWORD}

x-oidc-env: &oidc-env
  OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-SSO}
  OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
  OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS:-}
  OIDC_ADMIN_EMAILS: ${OIDC_ADMIN_EMAILS:-}

x-tools-image: &tools-image
  image: nova-tools:dev
  build:
    context: .
    dockerfile: tools/Dockerfile

x-tools-env: &tools-env
  DEMO_OWNER_PASSWORD: ${DEMO_OWNER_PASSWORD}
  DEMO_RO_PASSWORD: ${DEMO_RO_PASSWORD}

services:
  # --- Platform ---------------------------------------------------------------
  metadata-db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: ${METADATA_DB_USER}
      POSTGRES_PASSWORD: ${METADATA_DB_PASSWORD}
      POSTGRES_DB: superset
    volumes:
      - metadata-db:/var/lib/postgresql/data
      - ./postgres/init-metadata.sh:/docker-entrypoint-initdb.d/10-nova.sh:ro
    ports:
      - "127.0.0.1:${METADATA_DB_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${METADATA_DB_USER} -d nova"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    restart: unless-stopped

  redis:
    image: redis:8.8.4-alpine
    # volatile-lru only evicts keys with a TTL, so cache entries can be dropped
    # under pressure but Celery's queues cannot.
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "volatile-lru", "--save", ""]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 128m
    restart: unless-stopped

  # --- Demo data sources ------------------------------------------------------
  demo-postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: shop_owner
      POSTGRES_PASSWORD: ${DEMO_OWNER_PASSWORD}
      POSTGRES_DB: shop
    volumes:
      - demo-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DEMO_POSTGRES_HOST_PORT:-15433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop_owner -d shop"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    restart: unless-stopped

  demo-mysql:
    image: mysql:8.4.13
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=128M
    environment:
      MYSQL_ROOT_PASSWORD: ${DEMO_OWNER_PASSWORD}
      MYSQL_DATABASE: marketing
    volumes:
      - demo-mysql:/var/lib/mysql
    ports:
      - "127.0.0.1:${DEMO_MYSQL_HOST_PORT:-13306}:3306"
    healthcheck:
      # Over TCP on purpose: MySQL's temporary init server only listens on the
      # socket, so this stays unhealthy until the real server is up.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 3s
      timeout: 3s
      retries: 60
    mem_limit: 768m
    restart: unless-stopped

  seed:
    <<: *tools-image
    command: ["python", "-m", "seed.load"]
    environment: *tools-env
    depends_on:
      demo-postgres:
        condition: service_healthy
      demo-mysql:
        condition: service_healthy
    restart: "no"

  # --- Query federation -------------------------------------------------------
  trino:
    image: trinodb/trino:484
    entrypoint: ["/nova/entrypoint.sh"]
    environment:
      DEMO_RO_PASSWORD: ${DEMO_RO_PASSWORD}
    volumes:
      - ./trino/config.properties:/etc/trino/config.properties:ro
      - ./trino/catalog:/nova/catalog:ro
      - ./trino/entrypoint.sh:/nova/entrypoint.sh:ro
      - trino-catalogs:/etc/trino/catalog
      # Holds source credentials under secrets/. It has to be a path the image
      # already owns: Docker only copies ownership into a new volume then.
      - trino-data:/data/trino
    ports:
      - "127.0.0.1:${TRINO_HOST_PORT:-18080}:8080"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 30
    # The JVM heap is 80% of this limit (see jvm.config in the image).
    mem_limit: 2g
    restart: unless-stopped

  # --- Semantic layer -----------------------------------------------------------
  # Only Nova's API talks to Cube, with a token it signs per request, so it publishes no port.
  cube:
    image: cubejs/cube:v1.8.13
    environment:
      CUBEJS_DEV_MODE: "false"
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:?run `make env` first}
      CUBEJS_DB_TYPE: trino
      CUBEJS_DB_HOST: trino
      CUBEJS_DB_PORT: "8080"
      CUBEJS_DB_USER: nova-cube
      # Models name every table as catalog.schema.table, so the session's defaults are never used.
      CUBEJS_DB_PRESTO_CATALOG: system
      CUBEJS_DB_NAME: runtime
      CUBEJS_CACHE_AND_QUEUE_DRIVER: memory
      CUBEJS_LOG_LEVEL: warn
      CUBEJS_TELEMETRY: "false"
      NOVA_SKILLS_DIR: /nova/skills
    volumes:
      - ./cube/cube.js:/cube/conf/cube.js:ro
      - ../skills:/nova/skills:ro
    depends_on:
      trino:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/readyz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 30
    mem_limit: 1g
    restart: unless-stopped

  # --- BI engine --------------------------------------------------------------
  superset-init:
    image: nova-superset:6.1.0
    build:
      context: ./superset
    command: ["/app/nova/init.sh"]
    environment:
      <<: *superset-env
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_TRINO_URI: trino://nova@trino:8080
    depends_on:
      metadata-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  superset:
    <<: *superset-image
    environment:
      <<: *superset-env
      SERVER_WORKER_AMOUNT: "2"
      SERVER_THREADS_AMOUNT: "8"
      GUNICORN_TIMEOUT: "130"
    ports:
      - "127.0.0.1:${SUPERSET_HOST_PORT:-18088}:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully
      trino:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/health"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30
    mem_limit: 1536m
    restart: unless-stopped

  superset-worker:
    <<: *superset-image
    command: ["celery", "--app=superset.tasks.celery_app:app", "worker", "--pool=prefork", "-O", "fair", "-c", "2"]
    environment: *superset-env
    # Replaces the image's healthcheck, which curls a web server the worker
    # doesn't run. Pinging through the broker (db 6, see CeleryConfig) rather
    # than with --app avoids loading all of Superset on every probe.
    healthcheck:
      test: ["CMD-SHELL", "celery --broker=redis://redis:6379/6 inspect ping -d celery@$$HOSTNAME -t 5"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5
    depends_on:
      superset-init:
        condition: service_completed_successfully
    mem_limit: 1g
    restart: unless-stopped

  # --- Test runner (only with --profile test) ---------------------------------
  tests:
    <<: *tools-image
    profiles: ["test"]
    command: ["pytest", "tests", "-q"]
    # Runs as Trino's uid so it can write the credentials files it needs, the
    # same way the agent will.
    user: "1000:1000"
    volumes:
      - trino-data:/trino-data
    environment:
      <<: *tools-env
      SUPERSET_URL: ${SUPERSET_URL}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      NOVA_UI_ORIGIN: ${NOVA_UI_ORIGIN}
      TRINO_URL: ${TRINO_URL}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      superset:
        condition: service_healthy
      trino:
        condition: service_healthy

  agent-tests:
    image: nova-agent:dev
    build:
      context: ../agent
    profiles: ["test"]
    command: ["pytest", "-c", "agent/pyproject.toml", "--rootdir=/app", "agent/tests", "-q"]
    environment:
      <<: *agent-env
      DEMO_OWNER_PASSWORD: ${DEMO_OWNER_PASSWORD}
      NOVA_ADMIN_EMAIL: test-admin@nova.local
      NOVA_ADMIN_PASSWORD: test-admin-password
      # A real OpenID Connect provider, so the SSO tests exercise the whole protocol.
      OIDC_DISCOVERY_URL: http://dex:5556/dex/.well-known/openid-configuration
      OIDC_CLIENT_ID: nova-test
      OIDC_CLIENT_SECRET: not-a-secret-test-only
      OIDC_PROVIDER_NAME: Test SSO
      OIDC_ALLOWED_DOMAINS: nova.test
      OIDC_ADMIN_EMAILS: sso-admin@nova.test
    volumes:
      - ../skills:/app/skills
      - trino-data:/trino-data
    depends_on:
      metadata-db:
        condition: service_healthy
      superset:
        condition: service_healthy
      trino:
        condition: service_healthy
      cube:
        condition: service_healthy
      dex:
        condition: service_healthy

  dex:
    image: ghcr.io/dexidp/dex:v2.46.1
    profiles: ["test"]
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5556/dex/.well-known/openid-configuration"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 128m

  # --- Nova ---------------------------------------------------------------------
  agent:
    image: nova-agent:dev
    build:
      context: ../agent
    command: ["uvicorn", "agent.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: [*agent-env, *oidc-env]
    volumes:
      - ../skills:/app/skills
      # Trino reads the credentials of connected sources from here.
      - trino-data:/trino-data
    ports:
      - "127.0.0.1:${API_HOST_PORT:-18000}:8000"
    depends_on:
      metadata-db:
        condition: service_healthy
      superset:
        condition: service_healthy
      trino:
        condition: service_healthy
      cube:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20
    mem_limit: 1536m
    restart: unless-stopped

  ui:
    image: nova-ui:dev
    build:
      context: ../ui
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_HOST_PORT:-18000}
    ports:
      - "127.0.0.1:${UI_HOST_PORT:-13000}:3000"
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      agent:
        condition: service_healthy
    mem_limit: 384m
    restart: unless-stopped

volumes:
  metadata-db:
  demo-postgres:
  demo-mysql:
  trino-catalogs:
  trino-data:
